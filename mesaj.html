<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eonarya — Size Bir Mesaj Var</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    a{text-decoration:none;color:inherit}

    :root{
      --lav-300:#B9A4F2;
      --lav-100:#EFE7FF;
      --bg:#FBFAFE;
      --bg-soft:#F4F1FC;
      --surface:#FFFFFF;
      --ink:#16121F;
      --ink-soft:#534E61;
      --ink-faint:#938DA6;
      --line:#ECE6F7;
      --line-strong:#E0D8F2;
      --d-bg:#0A0713;
      --d-ink:#F4EFFF;
      --d-ink-soft:#BCB1D8;
      --d-ink-faint:#8479A6;
      --d-line:rgba(180,150,255,.16);
      --accent:#6D4CFF;
      --accent-soft:#8E72F2;
      --font-body:'Manrope',-apple-system,system-ui,sans-serif;
      --wrap:1180px;
    }

    html,body{height:100%}
    body{
      font-family:var(--font-body);
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    /* Nav */
    .nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(251,250,254,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav-inner{max-width:var(--wrap);margin:0 auto;padding:18px 40px;display:flex;align-items:center}
    .brand{display:flex;align-items:center;gap:11px}
    .brand-word{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.42em;font-size:16px;text-indent:.42em;color:var(--ink)}

    /* Main */
    .main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:100px 20px 60px;
    }

    .kart-wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:0}

    /* Card */
    .kart{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:20px;
      padding:40px 36px;
      box-shadow:0 4px 24px rgba(109,76,255,.06);
    }

    .kart-logo{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:28px;
      padding-bottom:22px;
      border-bottom:1px solid var(--line);
    }

    /* Yukleniyor */
    .yukleniyor-ic{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--ink-faint);
      font-size:14px;
    }
    .dot-spin{
      width:8px;height:8px;border-radius:50%;
      background:var(--accent);
      animation:pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

    /* Mesaj icerik */
    .gonderen-bilgi{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:24px;
    }
    .gonderen-avatar{
      width:36px;height:36px;border-radius:50%;
      background:var(--lav-100);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;font-weight:700;color:var(--accent);
      flex-shrink:0;
    }
    .gonderen-ad{font-size:13.5px;color:var(--ink-faint)}
    .gonderen-ad strong{color:var(--ink-soft);font-weight:600}

    .mesaj-baslik{
      font-size:22px;
      font-weight:700;
      color:var(--ink);
      letter-spacing:-.02em;
      line-height:1.3;
      margin-bottom:20px;
    }

    .mesaj-icerik{
      font-size:15.5px;
      line-height:1.8;
      color:var(--ink-soft);
      white-space:pre-wrap;
      word-break:break-word;
    }

    .mesaj-maddeler{
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .madde-satir{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .madde-nokta{
      width:6px;height:6px;border-radius:50%;
      background:var(--accent);
      margin-top:7px;
      flex-shrink:0;
    }
    .madde-metin{
      font-size:15px;
      line-height:1.7;
      color:var(--ink-soft);
    }

    .ayirici{
      height:1px;
      background:var(--line);
      margin:24px 0;
    }

    .teslimat-tarihi{
      font-size:12.5px;
      color:var(--ink-faint);
    }

    /* Hata */
    .hata-mesaj{font-size:15px;font-weight:600;color:#C0392B;line-height:1.6}
    .hata-aciklama{font-size:13.5px;color:var(--ink-faint);margin-top:8px;line-height:1.6}

    /* Footer */
    .footer{background:#070411;color:var(--d-ink);padding:40px 0}
    .footer-inner{
      max-width:var(--wrap);margin:0 auto;padding:0 40px;
      display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:16px;
    }
    .footer-brand-word{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.42em;font-size:14px;text-indent:.42em;color:var(--d-ink-soft)}
    .footer-links{display:flex;gap:24px;flex-wrap:wrap}
    .footer-links a{font-size:13.5px;color:var(--d-ink-faint);transition:color .2s}
    .footer-links a:hover{color:var(--d-ink-soft)}
    .footer-copy{font-size:12.5px;color:var(--d-ink-faint)}

    @media(max-width:600px){
      .nav-inner{padding:16px 20px}
      .main{padding:90px 16px 48px}
      .kart{padding:28px 22px}
      .footer-inner{padding:0 20px;flex-direction:column;align-items:flex-start;gap:20px}
    }
  </style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Eonarya ana sayfa">
      <svg viewBox="0 0 40 40" width="24" height="24" aria-hidden="true">
        <circle cx="20" cy="20" r="14" fill="none" stroke="url(#navRing)" stroke-width="2" stroke-linecap="round" stroke-dasharray="78 10" transform="rotate(-12 20 20)"/>
        <circle cx="33.2" cy="20" r="3.1" fill="var(--accent)"/>
        <defs>
          <linearGradient id="navRing" x1="20" y1="6" x2="20" y2="34">
            <stop offset="0" stop-color="#EFE7FF"/>
            <stop offset="0.5" stop-color="#9C82F0"/>
            <stop offset="1" stop-color="#4A28DF"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-word">EONARYA</span>
    </a>
  </div>
</header>

<main class="main">
  <div class="kart-wrap">
    <div class="kart">

      <div class="kart-logo">
        <svg viewBox="0 0 40 40" width="22" height="22" aria-hidden="true">
          <circle cx="20" cy="20" r="14" fill="none" stroke="url(#cardRing)" stroke-width="2" stroke-linecap="round" stroke-dasharray="78 10" transform="rotate(-12 20 20)"/>
          <circle cx="33.2" cy="20" r="3.1" fill="var(--accent)"/>
          <defs>
            <linearGradient id="cardRing" x1="20" y1="6" x2="20" y2="34">
              <stop offset="0" stop-color="#EFE7FF"/>
              <stop offset="0.5" stop-color="#9C82F0"/>
              <stop offset="1" stop-color="#4A28DF"/>
            </linearGradient>
          </defs>
        </svg>
        <span style="font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.38em;font-size:13px;text-indent:.38em;color:var(--ink-faint)">EONARYA</span>
      </div>

      <div id="yukleniyor">
        <div class="yukleniyor-ic">
          <div class="dot-spin"></div>
          Mesaj yükleniyor…
        </div>
      </div>

      <div id="mesaj" style="display:none">
        <div class="gonderen-bilgi">
          <div class="gonderen-avatar" id="avatarHarf">E</div>
          <div class="gonderen-ad">Gönderen: <strong id="gonderenAd"></strong></div>
        </div>
        <h1 class="mesaj-baslik" id="mesajBaslik"></h1>
        <div class="mesaj-icerik" id="mesajIcerik"></div>
        <div class="mesaj-maddeler" id="mesajMaddeler" style="display:none"></div>
        <div class="ayirici"></div>
        <p class="teslimat-tarihi" id="teslimatTarihi"></p>
      </div>

      <div id="hata" style="display:none">
        <p class="hata-mesaj" id="hataMesaj"></p>
        <p class="hata-aciklama" id="hataAciklama"></p>
      </div>

    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand-word">EONARYA</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="/gizlilik.html">Gizlilik Politikası</a>
      <a href="/kullanim-sartlari.html">Kullanım Şartları</a>
      <a href="mailto:destek@eonarya.com">İletişim</a>
    </nav>
    <span class="footer-copy">© <span id="yil"></span> Eonarya</span>
  </div>
</footer>

<script>
  document.getElementById('yil').textContent = new Date().getFullYear();

  const EDGE  = 'https://jvakvxaadntxzrbxrzcx.supabase.co/functions/v1/get-message';
  const token = new URLSearchParams(window.location.search).get('token') || '';

  const HATALAR = {
    token_eksik:      'Link eksik veya hatalı. Lütfen orijinal linki kullanın.',
    mesaj_bulunamadi: 'Bu mesaj bulunamadı. Link geçersiz olabilir.',
    icerik_bulunamadi:'Mesaj içeriği yüklenemedi.',
    baglanti_hatasi:  'Bağlantı hatası. Lütfen sayfayı yenileyin.',
  };

  function goster(id) {
    ['yukleniyor', 'mesaj', 'hata'].forEach(x => {
      document.getElementById(x).style.display = x === id ? 'block' : 'none';
    });
  }

  function gosterHata(kod, aciklama) {
    document.getElementById('hataMesaj').textContent    = HATALAR[kod] || 'Bir hata oluştu.';
    document.getElementById('hataAciklama').textContent = aciklama || '';
    goster('hata');
  }

  function formatTarih(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('tr-TR', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    } catch { return ''; }
  }

  async function init() {
    if (!token) { gosterHata('token_eksik'); return; }
    try {
      const res  = await fetch(EDGE + '?token=' + encodeURIComponent(token));
      const data = await res.json();

      if (!data.ok) { gosterHata(data.hata); return; }

      // Gonderen
      const ad = data.sender_name || 'Eonarya';
      document.getElementById('gonderenAd').textContent  = ad;
      document.getElementById('avatarHarf').textContent  = ad.charAt(0).toUpperCase();

      // Baslik
      document.getElementById('mesajBaslik').textContent = data.message_title || '';

      // Icerik
      document.getElementById('mesajIcerik').textContent = data.message_body || '';

      // Maddeler
      const maddeler = Array.isArray(data.message_maddeler) ? data.message_maddeler : [];
      if (maddeler.length > 0) {
        const liste = document.getElementById('mesajMaddeler');
        liste.style.display = 'flex';
        maddeler.forEach(m => {
          const satir = document.createElement('div');
          satir.className = 'madde-satir';
          satir.innerHTML =
            '<div class="madde-nokta"></div>' +
            '<span class="madde-metin">' + String(m).replace(/</g, '&lt;') + '</span>';
          liste.appendChild(satir);
        });
      }

      // Tarih
      const tarih = formatTarih(data.delivered_at);
      if (tarih) {
        document.getElementById('teslimatTarihi').textContent = 'İletildi: ' + tarih;
      }

      goster('mesaj');
    } catch {
      gosterHata('baglanti_hatasi');
    }
  }

  init();
</script>
</body>
</html>
